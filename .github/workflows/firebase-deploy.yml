name: Deploy to Firebase Hosting & Rules

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci --legacy-peer-deps || npm install --legacy-peer-deps
          elif [ -f yarn.lock ]; then
            yarn install --frozen-lockfile || yarn install
          else
            npm install --legacy-peer-deps
          fi

      - name: Build Next.js Application
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL || 'https://rasel.dev.bd' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Deploy to Firebase Hosting & Firestore
        run: |
          # Detect available credentials
          SA_KEY="${{ secrets.FIREBASE_SERVICE_ACCOUNT_BDFORUM247 || secrets.FIREBASE_SERVICE_ACCOUNT || secrets.GCP_SA_KEY }}"
          FB_TOKEN="${{ secrets.FIREBASE_TOKEN }}"

          if [ -n "$SA_KEY" ]; then
            echo "🔑 Authenticating via Google Service Account..."
            echo "$SA_KEY" > /tmp/firebase-service-account.json
            export GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-service-account.json
            npx firebase-tools deploy --only hosting,firestore:rules --project bdforum247 --non-interactive
            rm -f /tmp/firebase-service-account.json
          elif [ -n "$FB_TOKEN" ]; then
            echo "🔑 Authenticating via Firebase CI Token..."
            npx firebase-tools deploy --only hosting,firestore:rules --token "$FB_TOKEN" --project bdforum247 --non-interactive
          else
            echo "::error::❌ No Firebase credentials found in GitHub Secrets!"
            echo "::error::Please go to GitHub Repository -> Settings -> Secrets and variables -> Actions"
            echo "::error::And add 'FIREBASE_SERVICE_ACCOUNT_BDFORUM247' (Service Account JSON) or 'FIREBASE_TOKEN' (firebase login:ci token)."
            exit 1
          fi
        env:
          FIREBASE_CLI_EXPERIMENTS: webframeworks
