name: Deploy to Firebase Hosting & Rules

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci --legacy-peer-deps || npm install --legacy-peer-deps
          elif [ -f yarn.lock ]; then
            yarn install --frozen-lockfile || yarn install
          else
            npm install --legacy-peer-deps
          fi

      - name: Build Next.js Application
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL || 'https://rasel.dev.bd' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Deploy to Firebase Hosting (via Service Account)
        if: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_BDFORUM247 != '' }}
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_BDFORUM247 }}'
          channelId: live
          projectId: bdforum247
        env:
          FIREBASE_CLI_EXPERIMENTS: webframeworks

      - name: Deploy Firestore Rules (via Service Account)
        if: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_BDFORUM247 != '' }}
        run: |
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT_BDFORUM247 }}' > /tmp/sa.json
          GOOGLE_APPLICATION_CREDENTIALS=/tmp/sa.json npx firebase-tools deploy --only firestore:rules --project bdforum247 || true
          rm -f /tmp/sa.json

      - name: Deploy to Firebase (via Token Fallback)
        if: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_BDFORUM247 == '' && secrets.FIREBASE_TOKEN != '' }}
        run: |
          npx firebase-tools deploy --only hosting,firestore:rules --token "${{ secrets.FIREBASE_TOKEN }}" --project bdforum247
        env:
          FIREBASE_CLI_EXPERIMENTS: webframeworks
