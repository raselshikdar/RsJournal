<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient: Deep Obsidian Slate with subtle vignette -->
    <linearGradient id="rsBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181a26" />
      <stop offset="45%" stop-color="#0f111a" />
      <stop offset="100%" stop-color="#07080d" />
    </linearGradient>

    <!-- Crimson Brand Accent Gradient -->
    <linearGradient id="rsCrimsonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff3b47" />
      <stop offset="50%" stop-color="#e11d2a" />
      <stop offset="100%" stop-color="#b91c1c" />
    </linearGradient>

    <!-- Warm Gold Editorial Quill Tip Gradient -->
    <linearGradient id="rsGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Pure Platinum Letterform Gradient -->
    <linearGradient id="rsSilverGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>

    <!-- Outer Glow Ring -->
    <linearGradient id="rsRingGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff3b47" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#f59e0b" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.2" />
    </linearGradient>

    <filter id="rsGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Squircle Container -->
  <rect width="512" height="512" rx="124" fill="url(#rsBgGrad)" />
  <rect x="8" y="8" width="496" height="496" rx="116" fill="none" stroke="url(#rsRingGrad)" stroke-width="6" opacity="0.75" />

  <!-- Iconic Editorial Diamond Emblem Behind Monogram -->
  <g transform="translate(256, 256)">
    <!-- Ambient Brand Glow -->
    <circle cx="0" cy="0" r="140" fill="#e11d2a" opacity="0.16" filter="url(#rsGlow)" />

    <!-- Stylized Pen-Nib Geometry forming luxury monogram 'RS' -->
    <!-- Left Vertical Spine of 'R' with Fountain Nib angle -->
    <path
      d="M -112 -136 L -56 -136 L -56 136 L -112 136 Z"
      fill="url(#rsSilverGrad)"
    />

    <!-- Upper Loop of 'R' with precise editorial curvature -->
    <path
      d="M -56 -136 L 24 -136 C 76 -136 112 -104 112 -52 C 112 0 76 32 24 32 L -56 32 Z
         M -56 -86 L 16 -86 C 44 -86 62 -72 62 -52 C 62 -32 44 -18 16 -18 L -56 -18 Z"
      fill="url(#rsSilverGrad)"
      fill-rule="evenodd"
    />

    <!-- Dynamic Diagonal Leg of 'R' transitioning into Crimson Brand Quill Slit -->
    <path
      d="M -6 16 L 36 16 L 112 136 L 56 136 Z"
      fill="url(#rsCrimsonGrad)"
    />

    <!-- Modern Flowing 'S' Ribbon Accent in Crimson & Gold -->
    <path
      d="M 52 -136 C 88 -136 118 -124 136 -104 L 102 -72 C 90 -86 74 -94 52 -94 C 28 -94 14 -82 14 -68 C 14 -40 128 -34 128 42 C 128 102 76 136 -4 136 C -50 136 -88 118 -112 90 L -76 56 C -58 76 -32 90 -4 90 C 22 90 40 76 40 60 C 40 32 -74 38 -74 -38 C -74 -96 -20 -136 52 -136 Z"
      fill="url(#rsCrimsonGrad)"
      opacity="0.32"
    />

    <!-- Fountain Nib Heart-Piece / Golden Insight Spark -->
    <polygon
      points="-84,-52 -56,-80 -28,-52 -56,-24"
      fill="url(#rsGoldGrad)"
    />

    <!-- Clean ink slit line down the spine -->
    <line
      x1="-56" y1="-136"
      x2="-56" y2="136"
      stroke="#0f111a"
      stroke-width="5"
    />
  </g>
</svg>
