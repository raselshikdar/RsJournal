<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Deep Obsidian Slate Background Gradient -->
    <linearGradient id="journalBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141622" />
      <stop offset="50%" stop-color="#0c0d14" />
      <stop offset="100%" stop-color="#06070a" />
    </linearGradient>

    <!-- Luxury Rim Gradient: Crimson to Imperial Amber Gold -->
    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff4452" />
      <stop offset="45%" stop-color="#e11d2a" />
      <stop offset="75%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>

    <!-- Warm Golden Nib - Left Facet (Brilliant Light) -->
    <linearGradient id="goldLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb" />
      <stop offset="35%" stop-color="#fde047" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <!-- Warm Golden Nib - Right Facet (Deep Lustrous Amber) -->
    <linearGradient id="goldDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="50%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#92400e" />
    </linearGradient>

    <!-- Editorial Crimson Journal Wings - Left -->
    <linearGradient id="crimsonLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff4d5a" />
      <stop offset="60%" stop-color="#e11d2a" />
      <stop offset="100%" stop-color="#991b1b" />
    </linearGradient>

    <!-- Editorial Crimson Journal Wings - Right -->
    <linearGradient id="crimsonRight" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff3b47" />
      <stop offset="60%" stop-color="#c51622" />
      <stop offset="100%" stop-color="#7f1d1d" />
    </linearGradient>

    <!-- Ambient Core Glow -->
    <radialGradient id="ambientGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e11d2a" stop-opacity="0.3" />
      <stop offset="70%" stop-color="#f59e0b" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Squircle Base Canvas -->
  <rect width="512" height="512" rx="120" fill="url(#journalBg)" />
  
  <!-- Subtle Premium Outer Border Ring -->
  <rect x="14" y="14" width="484" height="484" rx="108" fill="none" stroke="url(#rimGrad)" stroke-width="8" opacity="0.85" />

  <!-- Ambient Underglow behind the emblem -->
  <circle cx="256" cy="256" r="170" fill="url(#ambientGlow)" />

  <g transform="translate(256, 256)">
    <!-- 1. Open Journal / Digital Codex Foundation Leaves (Left & Right) -->
    <!-- Left Codex Page Wing -->
    <path
      d="M -30 148 C -90 144 -155 120 -178 72 C -190 46 -188 20 -182 -4 C -180 -12 -170 -16 -162 -12 C -136 0 -88 22 -30 26 Z"
      fill="url(#crimsonLeft)"
      opacity="0.95"
    />
    <!-- Right Codex Page Wing -->
    <path
      d="M 30 148 C 90 144 155 120 178 72 C 190 46 188 20 182 -4 C 180 -12 170 -16 162 -12 C 136 0 88 22 30 26 Z"
      fill="url(#crimsonRight)"
      opacity="0.95"
    />

    <!-- Secondary Page Accents (Tech Code Brackets Angle / Modern Leaf) -->
    <path
      d="M -26 72 C -68 68 -118 48 -142 16 C -148 8 -144 -2 -136 -4 C -112 0 -72 16 -26 20 Z"
      fill="#ffffff"
      opacity="0.22"
    />
    <path
      d="M 26 72 C 68 68 118 48 142 16 C 148 8 144 -2 136 -4 C 112 0 72 16 26 20 Z"
      fill="#ffffff"
      opacity="0.22"
    />

    <!-- 2. Master Fountain Pen Nib (Vertical Majestic Icon) -->
    <!-- Left Bevel of Nib Tip -->
    <path
      d="M 0 -176 L -58 -32 C -88 40 -82 92 -54 136 L 0 136 L 0 -18 C -16 -18 -26 -28 -26 -44 C -26 -60 -14 -70 0 -70 Z"
      fill="url(#goldLight)"
    />

    <!-- Right Bevel of Nib Tip -->
    <path
      d="M 0 -176 L 58 -32 C 88 40 82 92 54 136 L 0 136 L 0 -18 C 16 -18 26 -28 26 -44 C 26 -60 14 -70 0 -70 Z"
      fill="url(#goldDark)"
    />

    <!-- Diamond Breather Heart-Piece (High Contrast Diamond Cut) -->
    <polygon
      points="0,-64 22,-44 0,-24 -22,-44"
      fill="#0c0d14"
    />

    <!-- Inner Golden Spark inside Breather Hole -->
    <polygon
      points="0,-56 12,-44 0,-32 -12,-44"
      fill="#fde047"
    />

    <!-- Precision Ink Fissure Line (Slit) from Tip to Breather Hole -->
    <line
      x1="0"
      y1="-176"
      x2="0"
      y2="-64"
      stroke="#0c0d14"
      stroke-width="5"
      stroke-linecap="round"
    />

    <!-- Subtle Golden Pen Nib Collar at bottom -->
    <path
      d="M -46 142 L 46 142 L 36 166 L -36 166 Z"
      fill="url(#goldDark)"
    />

    <!-- Crown Sparkle / North Star of Insight at Nib Tip -->
    <circle cx="0" cy="-176" r="4" fill="#ffffff" />
  </g>
</svg>
