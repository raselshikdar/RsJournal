<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180" width="100%" height="100%">
  <defs>
    <!-- Background Gradient: Obsidian Slate with rich depth -->
    <linearGradient id="rsBgApple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141724" />
      <stop offset="50%" stop-color="#0e1019" />
      <stop offset="100%" stop-color="#07080d" />
    </linearGradient>

    <!-- Outer Border Glow -->
    <linearGradient id="rsBorderApple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d92b2b" stop-opacity="0.85" />
      <stop offset="50%" stop-color="#f59e0b" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.6" />
    </linearGradient>

    <!-- Gold Fountain Nib Gradient -->
    <linearGradient id="goldNibApple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="35%" stop-color="#f59e0b" />
      <stop offset="70%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>

    <!-- Crimson Journal Accent Gradient -->
    <linearGradient id="crimsonAccentApple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff4d4d" />
      <stop offset="100%" stop-color="#b91c1c" />
    </linearGradient>

    <!-- Page White Gradient -->
    <linearGradient id="pageGradApple" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>

    <filter id="subtleGlowApple" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Container Squircle -->
  <rect width="180" height="180" rx="42" fill="url(#rsBgApple)" />
  <rect x="2" y="2" width="176" height="176" rx="40" fill="none" stroke="url(#rsBorderApple)" stroke-width="3" />

  <g transform="scale(1.4) translate(0, 0)">
    <!-- Journal Book Base Shadow & Structure -->
    <g transform="translate(18, 38)">
      <!-- Back Spine Shadow -->
      <path d="M 46 64 C 30 60 12 62 4 66 L 4 22 C 14 18 30 17 46 22 C 62 17 78 18 88 22 L 88 66 C 80 62 62 60 46 64 Z" fill="#000000" fill-opacity="0.4" />

      <!-- Left Open Page -->
      <path d="M 46 60 C 32 56 14 58 6 62 L 6 18 C 16 14 32 13 46 18 Z" fill="url(#pageGradApple)" fill-opacity="0.95" />
      <!-- Left Page Subtle Text Lines -->
      <line x1="14" y1="26" x2="38" y2="26" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round" opacity="0.6" />
      <line x1="14" y1="34" x2="38" y2="34" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round" opacity="0.6" />
      <line x1="14" y1="42" x2="32" y2="42" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round" opacity="0.6" />
      <line x1="14" y1="50" x2="35" y2="50" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round" opacity="0.6" />

      <!-- Right Open Page -->
      <path d="M 46 60 C 60 56 78 58 86 62 L 86 18 C 76 14 60 13 46 18 Z" fill="url(#pageGradApple)" fill-opacity="0.9" />
      <!-- Right Page Subtle Text Lines -->
      <line x1="54" y1="26" x2="78" y2="26" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round" opacity="0.6" />
      <line x1="54" y1="34" x2="78" y2="34" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round" opacity="0.6" />
      <line x1="54" y1="42" x2="72" y2="42" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round" opacity="0.6" />
      <line x1="54" y1="50" x2="75" y2="50" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round" opacity="0.6" />

      <!-- Book Spine Fold -->
      <line x1="46" y1="18" x2="46" y2="60" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round" />
    </g>

    <!-- Editorial Fountain Pen Nib -->
    <g transform="translate(64, 46)" filter="url(#subtleGlowApple)">
      <!-- Nib Upper Blade / Body -->
      <path d="M 0 -34 C 10 -34 14 -18 14 -6 L 14 8 L 0 30 L -14 8 L -14 -6 C -14 -18 -10 -34 0 -34 Z" fill="url(#goldNibApple)" />
      
      <!-- Pen Collar / Grip Band -->
      <rect x="-14" y="-34" width="28" height="6" rx="2" fill="url(#crimsonAccentApple)" />

      <!-- Golden Nib Shoulders Accent -->
      <path d="M 0 30 L 7 12 L -7 12 Z" fill="#fef08a" opacity="0.8" />

      <!-- Nib Breather Hole & Ink Slit -->
      <circle cx="0" cy="6" r="2.8" fill="#141724" />
      <line x1="0" y1="6" x2="0" y2="30" stroke="#141724" stroke-width="1.8" stroke-linecap="round" />
    </g>

    <!-- Dynamic Ink Point Spark -->
    <g transform="translate(64, 82)">
      <path d="M 0 -6 Q 12 0 20 -4 Q 28 -8 38 -2" fill="none" stroke="url(#crimsonAccentApple)" stroke-width="3" stroke-linecap="round" />
      <circle cx="0" cy="-6" r="3.2" fill="#d92b2b" />
      <circle cx="0" cy="-6" r="1.5" fill="#ffffff" />
    </g>

    <g transform="translate(94, 22)">
      <path d="M 6 0 Q 6 6 12 6 Q 6 6 6 12 Q 6 6 0 6 Q 6 6 6 0 Z" fill="#fbbf24" />
      <circle cx="6" cy="6" r="1.5" fill="#ffffff" />
    </g>
  </g>
</svg>
