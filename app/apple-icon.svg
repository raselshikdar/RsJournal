<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180">
  <defs>
    <!-- Background Gradient: Deep Slate to Obsidian with subtle rich emerald/crimson undertone -->
    <linearGradient id="bgGradApple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#12131a" />
      <stop offset="100%" stop-color="#08090d" />
    </linearGradient>

    <!-- Accent Journal Quill/Pen Gradient: Vibrant Crimson to Coral -->
    <linearGradient id="quillGradApple" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e11d2a" />
      <stop offset="50%" stop-color="#ff3b47" />
      <stop offset="100%" stop-color="#ff7b83" />
    </linearGradient>

    <!-- Golden Nib Spark Gradient -->
    <linearGradient id="goldGradApple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Subtle Inner Border Glow -->
    <linearGradient id="borderGradApple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#e11d2a" stop-opacity="0.4" />
    </linearGradient>

    <filter id="glowApple" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Rounded Icon Container -->
  <rect width="180" height="180" rx="42" fill="url(#bgGradApple)" />
  <rect x="2" y="2" width="176" height="176" rx="40" fill="none" stroke="url(#borderGradApple)" stroke-width="3" />

  <!-- Scaled Journal Graphic -->
  <g transform="scale(1.8) translate(0, 0)">
    <!-- Journal Pages Silhouette (Open Book / Journal) -->
    <g transform="translate(18, 22)">
      <!-- Left Leaf -->
      <path d="M 32 46 C 22 43 8 45 4 48 L 4 14 C 9 11 22 10 32 13 Z" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.22" stroke-width="1.2" stroke-linejoin="round" />
      <!-- Right Leaf -->
      <path d="M 32 46 C 42 43 56 45 60 48 L 60 14 C 55 11 42 10 32 13 Z" fill="#ffffff" fill-opacity="0.12" stroke="#ffffff" stroke-opacity="0.28" stroke-width="1.2" stroke-linejoin="round" />
      <!-- Spine Line -->
      <line x1="32" y1="13" x2="32" y2="46" stroke="#ffffff" stroke-opacity="0.35" stroke-width="1.5" stroke-linecap="round" />
      
      <!-- Journal Lines on Right Page -->
      <line x1="37" y1="19" x2="54" y2="19" stroke="#ffffff" stroke-opacity="0.22" stroke-width="1.2" stroke-linecap="round" />
      <line x1="37" y1="25" x2="52" y2="25" stroke="#ffffff" stroke-opacity="0.22" stroke-width="1.2" stroke-linecap="round" />
      <line x1="37" y1="31" x2="48" y2="31" stroke="#ffffff" stroke-opacity="0.22" stroke-width="1.2" stroke-linecap="round" />

      <!-- Journal Lines on Left Page -->
      <line x1="10" y1="19" x2="27" y2="19" stroke="#ffffff" stroke-opacity="0.16" stroke-width="1.2" stroke-linecap="round" />
      <line x1="12" y1="25" x2="27" y2="25" stroke="#ffffff" stroke-opacity="0.16" stroke-width="1.2" stroke-linecap="round" />
    </g>

    <!-- Editorial Fountain Pen / Nib representing Journal Craft -->
    <g transform="translate(43, 16) rotate(16)" filter="url(#glowApple)">
      <!-- Pen Body / Quill Blade -->
      <path d="M 14 0 C 18 10 21 24 18 36 L 10 47 L 2 36 C -1 24 2 10 6 0 Z" fill="url(#quillGradApple)" />
      <!-- Pen Collar -->
      <path d="M 5 26 L 15 26 L 14 34 L 6 34 Z" fill="url(#goldGradApple)" opacity="0.95" />
      <!-- Golden Nib Point -->
      <path d="M 6 34 L 14 34 L 10 47 Z" fill="url(#goldGradApple)" />
      <!-- Ink Slit -->
      <line x1="10" y1="31" x2="10" y2="44" stroke="#12131a" stroke-width="1.2" stroke-linecap="round" />
      <!-- Breather Hole -->
      <circle cx="10" cy="30" r="1.4" fill="#12131a" />
    </g>

    <!-- Sparkling Ink Star / Knowledge Spark -->
    <g transform="translate(68, 62)">
      <path d="M 8 0 Q 8 8 16 8 Q 8 8 8 16 Q 8 8 0 8 Q 8 8 8 0 Z" fill="#fbbf24" opacity="0.9" />
      <circle cx="8" cy="8" r="1.5" fill="#ffffff" />
    </g>
  </g>
</svg>
